# How application-b runs in the local stack: from its image, and under
# x-build — which compose ignores — from its working tree. See compose's
# README. Its variables are deploy/app.env, the file Kubernetes reads too.
x-build:
  application-b:
    run: cargo watch -w src -w imports/shared-libs -x run
    environment:
      RUST_LOG: debug

services:
  application-b:
    image: ghcr.io/thepartly/gitscale-demo/application-b:${GITSCALE_DEMO_APPLICATION_B_TAG:?}
    ports: ["8082:8080"]
    env_file: ${GITSCALE_DEMO_APPLICATION_B_DIR:?}/deploy/app.env
